# Verify this spec against `tao model ocdnet train --help` for the installed TAO version before training.
model:
  architecture: ocdnet
  pretrained_model_path: nvidia-ocr/models/pretrained/ocdnet/model
dataset:
  train_dataset_dir: nvidia-ocr/data/tao-ocdnet/train
  validation_dataset_dir: nvidia-ocr/data/tao-ocdnet/validation
train:
  image_width: 960
  image_height: 960
  batch_size: 4
  epochs: 100
  learning_rate: 0.0001
  num_workers: 4
  random_seed: 42
  output_dir: nvidia-ocr/models/checkpoints/ocdnet
postprocessing:
  confidence_threshold: 0.35
  polygon_threshold: 0.3
  nms_threshold: 0.2
