# Verify this spec against `tao model ocrnet train --help` for the installed TAO version before training.
model:
  architecture: ocrnet
  pretrained_model_path: nvidia-ocr/models/pretrained/ocrnet/model
dataset:
  dictionary: nvidia-ocr/dictionaries/woodapp_characters.txt
  train_manifest: nvidia-ocr/data/manifests/train.jsonl
  validation_manifest: nvidia-ocr/data/manifests/validation.jsonl
  test_manifest: nvidia-ocr/data/manifests/test.jsonl
train:
  input_height: 48
  max_input_width: 320
  preserve_aspect_ratio: true
  batch_size: 32
  epochs: 80
  learning_rate: 0.0001
  num_workers: 4
  random_seed: 42
  max_label_length: 16
  output_dir: nvidia-ocr/models/checkpoints/ocrnet
